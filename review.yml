findings:
  summary: >-
    Alectra Utilities is the Ontario control case for the question of whether a
    data mandate is the same thing as an implementation. Ontario did what no
    other Canadian province did and what the United States never did: it made
    Green Button compulsory by regulation, named the standard (NAESB REQ.21 ESPI
    v3.3), named the certifier (the Green Button Alliance) and set a date (1
    November 2023). Alectra responded the way a municipally owned wires company
    responds to a compliance obligation — it bought the capability. Both public
    Green Button surfaces run on savagedata.com under Alectra branding, and the
    Data Custodian software is a vendor product, not an Alectra product. That is
    not a criticism; it is the shape of the market the regulation created, and
    the same vendor pattern (Savage Data, ERTH GB Connector) recurs across
    Ontario LDCs. The consequence for developers is that the mandate produced a
    service, not a product: there is a documented right to the data and a
    documented way to apply for it, and there is nothing at all resembling a
    developer experience — no portal, no reference, no base URI, no scopes, no
    sandbox, no way to evaluate the contract before applying. Contrast this with
    Australia, where the same category of obligation produced a public register,
    a published base URI and anonymously callable discovery endpoints, and the
    difference between the two regulatory designs becomes measurable rather than
    rhetorical. The mandate replicated across jurisdictions; the verifiability
    did not.
  apisListed: 1
  apisListedNote: >-
    One API is listed — the Green Button Connect My Data service — because it is
    real, regulator-mandated, documented in Alectra's own terms of access, and
    reachable through a published third-party registration route. It is listed
    without a baseURL because Alectra publishes none. Download My Data is not
    listed, because a customer downloading an XML file from a portal is not an
    API.
  noFabrication: >-
    No endpoint, host, scope or specification was invented. Every URL in this
    file was probed and carries its HTTP status. The only specification saved is
    the Green Button Alliance's, harvested verbatim and labelled as not
    Alectra's. Alectra's ESPI path shape is recorded as unverified because the
    catch-all control probe made it unverifiable.

enrichment:
- round: '2026-07-27'
  method: >-
    Second pass under the API Evangelist enrichment pipeline. Re-ran contract
    discovery against every host (API host root, docs host, vendor hosts and the
    OpenAPI servers[] host), probed the full /.well-known/ surface with control
    paths, probed TLS/DNS posture, searched the package registries and the Green
    Button Alliance GitHub organisation, and derived the spec-grounded artifacts.
  contractDiscovery:
    conclusion: >-
      Confirmed again, harder: Alectra Utilities publishes no machine-readable
      contract. /openapi.json, /openapi.yaml, /swagger.json,
      /swagger/v1/swagger.json and /v1/openapi.json all 404 on both Savage Data
      hosts. /api-docs, /docs and /redoc return HTTP 200 on the onboarding host
      but serve the Blazor SPA shell — proven by a bogus control path returning
      the identical 200 — and 302 to the sign-in on the portal host. No GraphQL
      surface and no MCP server exists on any host. The single machine-readable
      contract in this repo remains the Green Button Alliance's own.
    probes:
    - {url: 'https://alectrautilitiesonboarding.savagedata.com/openapi.json', httpStatus: 404}
    - {url: 'https://alectrautilitiesonboarding.savagedata.com/swagger.json', httpStatus: 404}
    - {url: 'https://alectrautilitiesonboarding.savagedata.com/swagger/v1/swagger.json', httpStatus: 404}
    - {url: 'https://alectrautilitiesonboarding.savagedata.com/api-docs', httpStatus: 200, note: 'Blazor SPA shell, not a spec — control-probed.'}
    - {url: 'https://alectrautilitiesonboarding.savagedata.com/docs', httpStatus: 200, note: 'Blazor SPA shell.'}
    - {url: 'https://alectrautilitiesonboarding.savagedata.com/redoc', httpStatus: 200, note: 'Blazor SPA shell.'}
    - {url: 'https://alectrautilitiesonboarding.savagedata.com/.well-known/this-is-a-bogus-control-xyz123', httpStatus: 200, note: 'CONTROL. Identical SPA shell — proves the 200s above and the .well-known 200s are catch-all.'}
    - {url: 'https://alectrautilitiesgbportal.savagedata.com/openapi.json', httpStatus: 404}
    - {url: 'https://alectrautilitiesgbportal.savagedata.com/api-docs', httpStatus: 302}
    - {url: 'https://www.savagedata.com/openapi.json', httpStatus: 400}
    - {url: 'https://www.savagedata.com/api-docs', httpStatus: 404}
    - {url: 'https://sandbox.greenbuttonalliance.org:8443/DataCustodian/espi/1_1/resource/ApplicationInformation', httpStatus: 403, note: 'The GBA sandbox — not Alectra — and notably it returns a real 403 rather than a redirect to a login.'}
  wellKnown:
    conclusion: >-
      Nothing published anywhere. alectrautilities.com returns HTTP 403 for the
      entire /.well-known/ namespace (a directory-level block, since /llms.txt on
      the same host returns a normal 404); the portal host 302s everything; the
      onboarding host returns 200 with the SPA shell for every .well-known path
      including an invented one. No security.txt, no OAuth or OpenID metadata, no
      api-catalog, no ai-plugin.json, no llms.txt.
    detail: well-known/alectra-utilities-well-known.yml
  githubOrganization:
    url: https://github.com/alectrautilities
    httpStatus: 200
    finding: >-
      A personal GitHub account, not an organisation: 0 public repositories, no
      name, company, blog or bio, created 2025-04-04. It is not evidence of an
      Alectra engineering presence and no GitHubOrganization pointer was wired.
  domainSecurity:
    finding: >-
      The regulated data surface has a weaker posture than the domain Alectra
      controls. alectrautilities.com has DNSSEC, CAA pinning (Sectigo and Let's
      Encrypt), SPF, DMARC p=reject and HSTS max-age 31622400. savagedata.com,
      which hosts all three Alectra Green Button surfaces, has no DNSSEC, no CAA,
      DMARC p=quarantine and HSTS max-age 2592000.
    detail: security/alectra-utilities-domain-security.yml
  securityPrograms:
    finding: >-
      No vulnerability disclosure policy, no bug bounty, no security.txt and no
      trust centre on any Alectra or Savage Data host. No published security
      certification (SOC 2, ISO 27001, PCI DSS, HIPAA, FedRAMP). The only
      third-party attestation claimed anywhere is Green Button Alliance
      certification, which is data-standard conformance rather than a security
      compliance programme.
  packages:
    finding: >-
      No first-party client library in any registry, in any language. The Ruby
      gem "greenbutton" (v0.0.1, 2014) is a community parser, and the OpenESPI
      reference implementations belong to the Green Button Alliance. Recorded
      with official:false so they are never read as Alectra SDKs.
  pointerDiscipline: >-
    Artifacts were wired into apis.yml only where the underlying thing genuinely
    exists. Deliberately NOT wired, despite each being a scored check: WellKnown
    (nothing published), StatusPage (an electricity outage map is not an API
    status page, and status.alectrautilities.com does not resolve), Deprecation
    (no policy), Security / VulnerabilityDisclosure (none found), Compliance and
    TrustCenter (no published programme), SDKs (no first-party library),
    Idempotency (no idempotency contract — every operation is a GET), MCPServer
    (the mcp/ file is an explicitly labelled derived candidate, not a deployed
    server), AsyncAPI and Webhooks (no event surface exists), ChangeLog (customer
    news exists, a developer changelog does not). Scoring this provider higher by
    pointing at things it does not publish would invert the finding this repo
    exists to record.

