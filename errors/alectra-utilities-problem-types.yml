observed_platform_behaviour:
- host: https://alectrautilitiesgbportal.savagedata.com/
  behaviour: HTTP 302 redirect to /Connect/Authorize for EVERY path
  probed: '2026-07-27'
  note: >-
    Alectra's Green Button portal host returns a redirect to a customer sign-in for
    every request, including a deliberately invented control path. An unauthenticated
    client therefore never observes an ESPI status code at all — it observes an HTML
    login redirect. This is the single most important error-semantics fact for a
    would-be integrator and it is recorded because it was probed, not assumed.
