format_note: >-
  Not RFC 9457. The Green Button ESPI contract declares bare status codes with no
  response body schema and no application/problem+json media type; the success media
  type is application/atom+xml. Alectra Utilities publishes no error reference of any
  kind, so nothing beyond the specification's declared responses is recorded.
envelope:
  media_type: null
  note: >-
    No error envelope is described in the specification. ESPI error handling in
    practice is HTTP status plus, for OAuth failures, the RFC 6749 error object at
    the token endpoint — neither is documented by Alectra.
