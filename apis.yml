description: >-
  Alectra Utilities Corporation is Ontario's second-largest municipally owned
  electricity distributor and one of the largest local distribution companies
  (LDCs) in Canada, serving roughly one million customers across seventeen
  communities in the Greater Toronto and Hamilton Area and the Golden Horseshoe
  — Alliston, Aurora, Barrie, Beeton, Bradford West Gwillimbury, Brampton,
  Guelph, Hamilton, Markham, Mississauga, Penetanguishene, Richmond Hill,
  Rockwood, St. Catharines, Thornton, Tottenham and Vaughan. It also bills water
  and wastewater/stormwater on behalf of several of those municipalities, and
  runs the GRE&T Centre for grid innovation. It sits squarely in the wires and
  metering layer of the Canadian value chain: it does not generate, it does not
  operate the market (the IESO does), and it is owned by its municipal
  shareholders rather than by investors — the Crown/municipal ownership pattern
  that dominates Canadian electricity. Its API posture exists only because a
  regulator created it. Ontario Regulation 633/21 (Energy Data) requires every
  Ontario electric and gas utility to implement Green Button Download My Data
  and Connect My Data to the NAESB REQ.21 ESPI v3.3 standard and to obtain Green
  Button Alliance certification, with an implementation deadline of 1 November
  2023. Alectra publishes a Green Button page displaying GBA Certified DMD and
  CMD marks, a Green Button Connect My Data Terms and Conditions of Access and
  Use citing O. Reg. 633/21 by name, a live customer Green Button portal, and a
  live third-party registration and onboarding site — all three hosted by its
  data custodian vendor, Savage Data Systems, not by Alectra. What Alectra does
  not publish is any of the things that would let an outsider verify the
  implementation: there is no developer portal, no API documentation, no base
  URI, no OpenAPI, no scopes and no OAuth metadata anywhere on
  alectrautilities.com or on the portal host. developer., developers., docs. and
  data.alectrautilities.com do not resolve; /developers, /api, /docs, /data,
  /openapi.json and /swagger.json all return HTTP 404. Every path on the Green
  Button portal — including a deliberately invented control path — HTTP 302
  redirects to a customer sign-in, so no endpoint could be confirmed. The
  resulting split is the finding: a mandated consumer-data API that a third
  party can reach only by completing an application and being approved, and
  zero open market or grid data of any kind, because in Ontario that layer
  belongs to the IESO and the OEB rather than to the distributor.
