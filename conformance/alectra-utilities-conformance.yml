compliance_program:
  published: false
  certifications: []
  trust_center: null
  detail: >-
    No SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP claim, no trust centre and no
    published security-compliance programme was found on any Alectra or Savage Data
    host (probe-security-programs.py, 2026-07-27: vdp=none trust=none). The only
    third-party attestation Alectra claims is Green Button Alliance certification of
    the Green Button service, which is a data-standard conformance certification
    rather than a security-compliance programme, and which could not be corroborated
    against a public registry entry naming Alectra. No Compliance pointer is emitted.
registry_evidence:
  green_button_directory:
    url: https://www.greenbuttonalliance.org/directory-services
    status: 200
    fetched: '2026-07-27'
    finding: >-
      The Green Button Alliance does operate a public "Green Button Directory" of
      Utilities (data custodians), Third-Party App Providers and Utility-Platform
      Providers — a registry surface the previous round did not locate. The listings
      are delivered through a client-side search panel, and the GBA states the service
      is "not approved for automated retrieval, embedding, or screen-scraping", so no
      listing data is copied here. A site-wide search of greenbuttonalliance.org for
      "Alectra" returned "Found 0 Results" on 2026-07-27.
  vendor_member_profile:
    url: https://www.greenbuttonalliance.org/members/savage-data-systems
    status: 200
    fetched: '2026-07-27'
    finding: >-
      Savage Data Systems — the data custodian vendor that operates all three Alectra
      Green Button hosts — has a Green Button Alliance member profile, company type
      "Vendor to Utilities", with CMD Platform Information and DMD Platform
      Information both listed for Electricity, Natural Gas and Water. This is the
      first corroborating link found for the certification chain: it confirms the
      vendor is a GBA member with CMD and DMD platforms, though the profile itself
      states no certification date or ESPI version, and names no utility customers.
      Alectra's certification claim therefore remains uncorroborated at the utility
      level, but is now materially more plausible at the platform level.
