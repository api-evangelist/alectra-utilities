generated: '2026-07-27'
method: derived
source: >-
  openapi/alectra-utilities-green-button-espi-openapi.json, review.yml probes, and
  searched Green Button Alliance / Ontario regulatory surfaces, 2026-07-27
scope_note: >-
  Conformance here is asserted against the CONTRACT Alectra is obliged to implement,
  not against an observed Alectra endpoint. No Alectra endpoint could be exercised
  anonymously — every path on the Green Button portal host returns HTTP 302 to a
  customer sign-in, including a bogus control path — so every row below is marked
  with what it is evidenced by. Nothing is asserted as verified against Alectra.
standards:
- id: green-button-espi
  name: Green Button / NAESB REQ.21 Energy Services Provider Interface
  conforms: claimed
  version_required: ESPI v3.3 (prescribed by O. Reg. 633/21)
  evidence: >-
    Alectra's Green Button page displays the Green Button Certified Download My Data
    and Connect My Data marks and describes the service as government-mandated; its
    Green Button Connect My Data Terms and Conditions of Access and Use cite Ontario
    Regulation 633/21 by name. Certification could not be corroborated against a
    public registry naming Alectra.
  verified: false
- id: ontario-reg-633-21
  name: Ontario Regulation 633/21 (Energy Data), Electricity Act 1998
  conforms: designated
  evidence: >-
    Alectra is an Ontario electricity distributor and is therefore covered by the
    regulation; Alectra acknowledges the obligation in its own terms of access.
    Ontario publishes no CDR-style register of data holders and the OEB publishes no
    machine-readable compliance list, so there is no register entry to cite.
  verified: false
- id: oauth2
  name: OAuth 2.0 (RFC 6749)
  conforms: true
  evidence: >-
    The Green Button CMD contract declares an oauth2 securityScheme with
    authorizationCode and clientCredentials flows, applied to every operation. Alectra
    publishes no OAuth metadata of its own; probes of /DataCustodian/oauth/authorize
    and /DataCustodian/oauth/token on the portal host returned the catch-all 302.
  verified: false
- id: rfc4287-atom
  name: Atom Syndication Format (RFC 4287)
  conforms: true
  evidence: >-
    All ESPI resources are carried as Atom feeds and entries — components.schemas
    declares AtomFeed, AtomEntry, AtomLink and AtomContent in the
    http://www.w3.org/2005/Atom namespace, and every success response is
    application/atom+xml.
- id: rfc3339-timestamps
  name: RFC 3339 date/time
  conforms: true
  evidence: >-
    published-min/published-max/updated-min/updated-max query parameters are declared
    as RFC 3339 instants on every collection operation.
- id: rfc9457-problem-details
  name: RFC 9457 Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    No application/problem+json media type and no error response schema anywhere in
    the contract; 400 and 403 are declared as bare status codes.
- id: rfc9116-security-txt
  name: RFC 9116 security.txt
  conforms: false
  evidence: >-
    Probed 2026-07-27 on all four hosts. alectrautilities.com returns HTTP 403 for the
    whole /.well-known/ namespace; the vendor hosts return 404 or a catch-all HTML
    shell. See well-known/alectra-utilities-well-known.yml.
- id: rfc8414-oauth-metadata
  name: RFC 8414 OAuth 2.0 Authorization Server Metadata
  conforms: false
  evidence: No discovery document on any host; the 200s on the onboarding host are a Blazor SPA shell (control-probed).
- id: openid-connect-discovery
  name: OpenID Connect Discovery
  conforms: false
  evidence: Not published; alectrautilities.com/.well-known/openid-configuration returns HTTP 403.
- id: rfc8594-sunset-header
  name: RFC 8594 Sunset HTTP Header
  conforms: false
  evidence: No deprecation or sunset signalling documented.
- id: openapi
  name: OpenAPI Specification
  conforms: false
  evidence: >-
    Alectra publishes no OpenAPI. The document in openapi/ is the Green Button
    Alliance's, harvested verbatim from the GBA GitHub organisation and labelled as
    not Alectra's.
- id: iso-8601
  name: ISO 8601
  conforms: true
  evidence: Atom published/updated elements are declared as date-time (ISO 8601).
