agent_notes:
- Every tool is a read; the contract exposes no write operations.
- Responses are application/atom+xml, not JSON — an agent must parse Atom + ESPI XML.
- Collections page with start-index (1-indexed) and max-results, and filter with published-min/published-max/updated-min/updated-max
  as RFC 3339 instants.
- The depth parameter controls how much of the related ESPI graph is inlined.
- A 403 usually means the customer Authorization is expired, revoked (status 0) or denied (status 2),
  not that the resource is missing.
- This data is personal consumption data for an identified retail customer. Use is bound by the customer's
  express consent and by Alectra's Green Button Connect My Data Terms and Conditions of Access and Use.
