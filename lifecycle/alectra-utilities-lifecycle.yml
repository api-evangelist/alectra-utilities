versioning:
  scheme: uri-path
  current: 1_1
  docs: null
  detail: >-
    Resources are served under /espi/1_1/resource/. The path segment is the ESPI REST
    resource-path version; the data-standard version is separate and is set by the
    regulator, not by Alectra — Ontario Regulation 633/21 prescribes NAESB REQ.21 ESPI
    v3.3, while the harvested Green Button Alliance document describes itself as
    "ESPI 4.0". Alectra names no version anywhere on its own pages, describing the
    output only as an "industry-standardized XML format".
  governed_by: external
  governance_note: >-
    Version lifecycle for this contract is owned by NAESB (the standard), the Ontario
    Ministry of Energy / Ontario Energy Board (the mandate) and the Green Button
    Alliance (certification) — not by Alectra Utilities, which consumes a vendor
    implementation from Savage Data Systems. There is no Alectra version policy to
    find, and there would be no reason for one to exist.
