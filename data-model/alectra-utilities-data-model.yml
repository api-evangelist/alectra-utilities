model_gaps:
  note: >-
    The harvested contract stops at UsagePoint. The ESPI resources that actually carry
    consumption — MeterReading, ReadingType, IntervalBlock, IntervalReading,
    ElectricPowerUsageSummary, UsageSummary and the customer/PII resources reached via
    customerResourceURI — are part of NAESB REQ.21 but are NOT described in this
    document, and Alectra describes none of them. They are deliberately not modelled
    here rather than assumed.
